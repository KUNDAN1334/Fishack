[project]
name = "fishly"
version = "0.1.0"
description = "Fishly — multi-tenant RAG customer support assistant. Fishes out the exact answer from a sea of docs; every claim cited, verified, and confidence-gated."
requires-python = ">=3.12"
dependencies = [
    # Web framework + validation (Pydantic v2 is a hard project constraint)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Postgres driver. asyncpg over psycopg because the whole request path is
    # async (FastAPI) and asyncpg's binary protocol is the fastest option.
    "asyncpg>=0.29",
    # Redis async client (caching, budget counters)
    "redis>=5.0",
    # Raw HTTP for all LLM providers — no vendor SDKs (see ADR-006)
    "httpx>=0.27",
    # Local embeddings + the tokenizer used for chunk sizing (Phase 1).
    # Pulls torch (~2GB, CPU wheel is fine — no GPU required anywhere).
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # In-memory Redis for tests — no docker needed to run the test suite
    "fakeredis>=2.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "fishnet*"]

[tool.pytest.ini_options]
# auto mode: every `async def test_*` runs under an event loop without
# needing an explicit @pytest.mark.asyncio on each test
asyncio_mode = "auto"
testpaths = ["tests"]
